<!DOCTYPE html>
<!-- ColliBoy - standalone error page rendered for non-200 responses -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{ code }} - Web 3D Builder</title>
    <style>
        /* Reset so this page renders standalone, without app.css */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .error-container { text-align: center; }
        .error-code { font-size: 72px; font-weight: bold; color: #e94560; }
        .error-message { font-size: 20px; margin-top: 16px; color: #a0a0b0; }
        /* Accent colors track the app palette so the page blends with the main UI (ColliBoy) */
        .back-link { display: inline-block; margin-top: 32px; padding: 10px 24px; background: #16213e; color: #0f3460; text-decoration: none; border-radius: 6px; font-weight: 500; }
        .back-link:hover { background: #0f3460; color: #fff; }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">{{ code }}</div>
        <p class="error-message">{{ message }}</p>
        <a href="/" class="back-link">&larr; Back to 3D Builder</a>
    </div>
</body>
</html>
